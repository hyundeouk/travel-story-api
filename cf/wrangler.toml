# 여행 스토리 — Cloudflare Workers 설정 (배포-cloudflare.bat 가 처음에 database_id 를 채운다)
name = "travel-story"
main = "dist/worker.js"
no_bundle = true
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_als"]
workers_dev = true

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "travel-story"
database_id = "8c99e97d-488f-47ee-b5eb-c8e3419d4cba"

# 사진 저장소 (D1 한 개는 500MB 까지라 사진은 3개에 나눠 담는다. 배포-cloudflare.bat 가 처음에 만들어 채운다)
[[d1_databases]]
binding = "PH1"
database_name = "travel-story-photos1"
database_id = "126792f4-999a-4152-9af9-037ef8aa188c"

[[d1_databases]]
binding = "PH2"
database_name = "travel-story-photos2"
database_id = "95793255-adf5-40e4-81f9-8ac8b4add7fb"

[[d1_databases]]
binding = "PH3"
database_name = "travel-story-photos3"
database_id = "b841f09d-3354-43e3-9ccc-62100d6b02cf"

